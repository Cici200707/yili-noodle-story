function currentIntro(video){return state.view==='intro'&&document.querySelector('#introVideo')===video}
async function prepareIntro(video){
 if(!currentIntro(video)||introDownload)return;
 const controller=new AbortController();introDownload=controller;
 const status=document.querySelector('#introStatus'),button=document.querySelector('#introPlay');
 button.hidden=true;status.textContent='正在缓冲开场短片…';
 const timeout=setTimeout(()=>controller.abort(),60000);
 try{
  const response=await fetch(introSource,{signal:controller.signal});
  if(!response.ok)throw new Error('Video HTTP '+response.status);
  let blob;
  if(response.body&&response.body.getReader){
   const reader=response.body.getReader(),parts=[],total=Number(response.headers.get('content-length'));let loaded=0;
   while(true){const part=await reader.read();if(part.done)break;parts.push(part.value);loaded+=part.value.byteLength;if(currentIntro(video))status.textContent=total?'正在缓冲开场短片… '+Math.min(99,Math.floor(loaded/total*100))+'%':'正在缓冲开场短片… '+Math.round(loaded/1024)+' KB'}
   blob=new Blob(parts,{type:'video/mp4'});
  }else blob=await response.blob();
  if(!currentIntro(video)||controller.signal.aborted)return;
  if(!blob.size)throw new Error('Empty video');
  introBlobURL=URL.createObjectURL(blob);video.src=introBlobURL;video.controls=true;video.load();
  status.textContent='缓冲完成，正在打开短片…';playIntro();
  // The complete clip is now local; scene requests cannot interrupt playback.
  preloadScenes();
 }catch(error){if(currentIntro(video)){status.textContent='短片加载未完成，可点击重试，或跳过进入剧情。';button.textContent='重新加载开场短片';button.hidden=false}}
 finally{clearTimeout(timeout);if(introDownload===controller)introDownload=null}
}

 if(index!==null&&loader){scenePending=true;if(loader.peek(sceneSources[index]))commit();else{sceneHintTimer=setTimeout(()=>{if(ticket===sceneRenderToken)sceneNotice()},180);loader.load(sceneSources[index],'high').then(commit,()=>{if(ticket===sceneRenderToken){clearSceneNotice();sceneNotice(true)}})}}else{scenePending=false;commit()}

function renderHome(){const s=saved();app.innerHTML=`<div class="home"><section class="hero"><div class="hero-copy"><div class="overline">一场关于先义后利的互动叙事</div><h1>义利之衡<small>一碗擀面皮的价格</small></h1><p class="intro">一份售价不过十元的小吃，一次被曝光的卫生隐患。<br>当“真诚”需要以<em>近900万元</em>为代价，<br>坐在经理办公室里的你，会如何选择？</p><div class="hero-actions"><button class="primary" data-action="start">进入决策现场 <span aria-hidden="true">↗</span></button>${s?'<button class="quiet" data-action="resume">继续上次剧情</button>':'<button class="quiet" data-action="how">了解玩法</button>'}</div><p class="meta">15秒开场短片 · 十三幅场景 · 剧情配乐 · 四种结局</p></div><div class="scene"><img class="cover-art" src="${sceneSources[0]}" alt="${sceneDescriptions[0]}" width="1672" height="941"><span class="scene-note">你签下的每个决定，都有重量。</span></div></section><section class="chapter-list" aria-label="故事章节"><div class="chapter-item"><b>01</b><div><strong>隐患与人情</strong><span>一段视频，打破平静</span></div></div><div class="chapter-item"><b>02</b><div><strong>代价与担当</strong><span>一张账单，重若千钧</span></div></div><div class="chapter-item"><b>03</b><div><strong>问责与初心</strong><span>一份名单，照见选择</span></div></div></section></div>`}

let typingTimer=null,typing=false,typingText='',instantText=false;
try{instantText=localStorage.getItem('yili-instant-text')==='1'}catch(e){}

function finishTyping(){stopTyping();const el=document.querySelector('#typedText');if(el)el.textContent=typingText;const caret=document.querySelector('#typingCaret');if(caret)caret.hidden=true;const next=document.querySelector('[data-vn-advance]');if(next)next.textContent=next.dataset.completeLabel;document.querySelectorAll('[data-after-typing]').forEach(e=>e.hidden=false)}
function streamText(text){stopTyping();typingText=text;const el=document.querySelector('#typedText');if(!el)return;const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;if(instantText||reduced){finishTyping();return}typing=true;const chars=Array.from(text);let n=0;const step=()=>{if(!typing||!el.isConnected)return;el.textContent=chars.slice(0,++n).join('');el.parentElement.scrollTop=el.parentElement.scrollHeight;if(n>=chars.length){finishTyping();return}typingTimer=setTimeout(step,/[，。！？；：…]/.test(chars[n-1])?145:27)};step()}

function vnAdvance(){if(scenePending)return;if(typing){finishTyping();return}if(state.chapter===3){state.view='report';render();scrollToTop();return}const c=state.chapter;if(state.phase==='result'){state.chapter++;state.line=0;state.phase='dialogue'}else if(state.phase==='choice'){return}else{const last=c===2?2:chapters[c].dialogue.length-1;if(state.line<last)state.line++;else if(c===2){state.chapter=3;try{localStorage.removeItem(KEY)}catch(e){}}else state.phase='choice'}if(state.chapter<3)save();render()}
function renderGame(){const c=state.chapter,final=c===2,d=chapters[Math.min(c,1)],e=final?ends[ending(...state.picks)]:null,last=final?2:d.dialogue.length-1,scene=pickScene();let text,speaker,label;
if(state.phase==='result'){const result=d.results[state.picks[c]];text=result[1];speaker=result[0];label=c===0?'进入第二回':'进入第三回'}else{speaker=final?(state.line===0?'旁白':'品控员 · 小李'):d.dialogue[state.line][0];text=final?(state.line===0?'凌晨两点，办公室的灯还亮着。小李拿着一份名单走进来，神色凝重。':state.line===1?e.dialogue:'这份名单的重量，来自你亲手作出的每一个决定。'):d.dialogue[state.line][1];label=state.line<last?'继续对话 →':final?'查看你的结局':'作出选择'}
const choice=state.phase==='choice';
app.innerHTML='<section class="vn-stage" aria-label="第一人称剧情场景"><img class="vn-backdrop" src="'+sceneSources[scene]+'" alt="'+sceneDescriptions[scene]+'" style="object-position:'+(scene===8?'32% 35%':scene===10?'65% 35%':'52% 35%')+'" decoding="async"><div class="vn-shade"></div>'+vnToolbar(final?'第三回 · 问责与初心':d.chapter,(final?'2024年6月27日 02:00':d.time)+'　|　'+(final?'调查报告发布前夕':d.title)+(scene===7?'　｜　举报视频示意':''))+(choice?'<div class="vn-choices"><div class="vn-ending-label">你的决定，将改变接下来的故事</div><h3>'+d.question+'</h3>'+d.choices.map((v,i)=>'<button class="choice" data-action="choose" data-pick="'+i+'"><b>'+'ABC'[i]+'</b><span>'+v[0]+'<small>'+v[1]+'</small></span></button>').join('')+'<button class="textbtn" data-action="backdialog">返回对话</button></div>':'<div class="vn-bottom">'+vnText(text,speaker,label,state.phase==='result'?'决定已记录':(state.line+1)+' / '+(last+1),state.phase==='dialogue'?'<button class="textbtn" data-action="prev" '+(state.line===0?'disabled':'')+'>上一段</button>':'')+'</div>')+'</section>';
presentScene(scene,choice?null:text)}

function renderReport(){app.innerHTML=`<section class="report"><div class="overline">中国精神导引 · 小组汇报</div><h2>先立其义，再谋其利。</h2><p class="report-lead">一碗擀面皮的价格可以标在菜单上。<br>顾客的安全、企业的诚实与应负的责任，如何定价？</p><div class="report-grid"><article><small>从第一回看 · 何为义</small><h3>先守底线</h3><p>食品安全关乎消费者的基本利益。面对人情与经营压力，及时关停、核查和上报，让经营活动以安全和诚信为前提。</p></article><article><small>从第二回看 · 如何行义</small><h3>愿担代价</h3><p>公开问题、退款补偿、奖励举报，让责任落到实际行动。先义后利的考验，往往发生在“做正确的事需要付出代价”时。</p></article><article><small>从第三回看 · 怎样守义</small><h3>落实问责</h3><p>补偿回应当下损害，问责和制度改进回应未来风险。关系再深，也不能使责任落空；纠错值得肯定，也不等于免于问责。</p></article></div><div class="lesson"><h3>我们对“先义后利”的理解</h3><p>“义”在这里体现为安全、诚信、公平与担当；“利”是合理的经营收益。先义后利要求把公共利益和应尽责任放在利益计算之前，并在这个前提下追求可持续经营。它既有价值的排序，也需要行动的兑现。</p></div><h3 style="font-size:25px">四条路径，同一面镜子</h3><table class="route-table"><thead><tr><th>首次处理</th><th>赔偿选择</th><th>剧本结局</th></tr></thead><tbody><tr><td>降级或封口</td><td>回避或象征性补偿</td><td>玩火自焚，反噬其身</td></tr><tr><td>主动上报</td><td>回避或象征性补偿</td><td>算盘落空，信任破产</td></tr><tr><td>主动上报</td><td>公开并承担赔偿</td><td>散尽千金，法不容情</td></tr><tr><td>降级或封口</td><td>公开并承担赔偿</td><td>浪子回头，戴罪立功</td></tr></tbody></table><section class="news-origin" aria-labelledby="newsOrigin"><h3 id="newsOrigin">取材于胖东来“擀面皮事件”</h3><p>2024年6月，顾客反映新乡胖东来联营餐饮的加工场所存在卫生问题。胖东来随后公布调查结果，终止与涉事商户合作并对相关人员问责；对涉及的8833份消费办理退款、每份补偿1000元，并奖励发现隐患的顾客10万元。</p><a href="https://finance.youth.cn/finance_gdxw/202406/t20240627_15342478.htm" target="_blank" rel="noopener noreferrer">新闻来源：中国青年网，2024年6月27日</a></section><blockquote class="closing-line">规矩立住了，路才能越走越宽，这碗擀面皮，吃着不烧心！</blockquote><div class="end-actions"><button class="primary" data-action="start">带着思考，再选一次</button><button class="quiet" data-action="ledger">查看赔偿账单</button></div></section>`}

document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;if(a==='retry-scene'){render();return}if(scenePending&&['advance','prev','choose','backdialog','end','next','chapter','skip','reveal'].includes(a))return;if(a==='skipintro'){beginStory();return}if(a==='playintro'){playIntro();return}if(['start','resume','advance','choose'].includes(a))window.StoryMusic?.unlock();if(a==='soundsettings'){musicSettings();return}if(a==='musictoggle'){window.StoryMusic?.toggle();return}if(a==='advance'){vnAdvance();return}if(a==='reveal'){finishTyping();return}if(a==='textmode'){instantText=!instantText;try{localStorage.setItem('yili-instant-text',instantText?'1':'0')}catch(e){}render();return}if(a==='backdialog'){state.phase='dialogue';save();render();finishTyping();return}if(a==='case'){const c=Math.min(state.chapter,2);show('当前案情',c===2?'<p>赔偿方案已经敲定，问责名单已拟好。前两次决定将决定你如何面对最后这份文件。</p>':'<p>'+chapters[c].context+'</p>');return}if(a==='reflection'){showReflection();return}if(a==='home')home();if(a==='start')start();if(a==='resume'){const s=saved();if(s){state=s;render();scrollToTop()}}if(a==='report'){state.view='report';render();scrollToTop()}if(a==='projection'){projection=!projection;document.body.classList.toggle('projection',projection);b.setAttribute('aria-pressed',String(projection));b.textContent=projection?'退出投影':'投影模式';toast(projection?'投影模式已开启 · 剧情文字已放大':'已退出投影模式')}if(a==='how')show('你将扮演张经理','<p>从经理办公室出发，读完角色对话后作出决定。第一回处理卫生隐患，第二回面对赔偿代价，第三回呈现问责结果。</p><p>两次选择组合出四种结局。游戏不会用分数提前提示答案，请按你的判断决定。进度只保存在当前浏览器。</p><p>课堂展示可用顶部“投影模式”；结束后进入“汇报与思考”，对照不同路径。</p>');if(a==='close')modal.close();if(a==='evidence')show('调查摘要',sceneFrame(7)+'<p>司机小金拍摄的视频反映：实际加工点与报备地址不一致，卫生条件不符合公司标准。</p><div class="ledger"><div><span>报备地点</span><strong>八里营</strong></div><div><span>实际地点</span><strong>引黄路</strong></div></div><p>剧情后续调查确认：该加工点于6月9日至19日临时启用，涉及8833份擀面皮、香辣面。以上背景沿用用户剧本，非本网页独立调查。</p>');if(a==='ledger')ledger();if(a==='next'){if(typing){finishTyping();return}state.line++;save();render()}if(a==='prev'){state.line=Math.max(0,state.line-1);save();render()}if(a==='skip'){state.phase='dialogue';state.line=state.chapter===2?2:chapters[state.chapter].dialogue.length-1;save();render();finishTyping()}if(a==='choose'){state.picks[state.chapter]=Number(b.dataset.pick);state.phase='result';save();render();scrollToTop()}if(a==='chapter'){state.chapter++;state.line=0;state.phase='dialogue';save();render();scrollToTop()}if(a==='end'){state.chapter=3;render();try{localStorage.removeItem(KEY)}catch(e){}scrollToTop()}if(a==='allends')show('四种结局',ends.map((e,i)=>`${sceneFrame(i+3)}<h3 style="color:var(--gold);margin-bottom:4px">${e.title}</h3><p>${e.text}</p>`).join(''));});
modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)modal.close()}});
document.addEventListener('keydown',e=>{if(state.view!=='game'||modal.open||e.repeat||e.altKey||e.ctrlKey||e.metaKey)return;const focused=e.target.closest&&e.target.closest('button,input,textarea,select,a,summary');if(focused)return;if(e.code==='Space'||e.code==='Enter'){e.preventDefault();if(state.phase==='choice')return;vnAdvance()}});
